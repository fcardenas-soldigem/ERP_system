server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # Fallback SPA: cualquier ruta del router regresa index.html
  error_page 404 /index.html;

  # === SECURITY HEADERS ===
  # HSTS: Fuerza HTTPS por 1 año (descomenta cuando tengas HTTPS configurado)
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  
  # CSP: Content Security Policy - ajusta según tus necesidades
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://erp-backend-25656632090.southamerica-west1.run.app https://*.run.app; frame-ancestors 'none';" always;
  
  # Previene clickjacking
  add_header X-Frame-Options "DENY" always;
  
  # Previene MIME-type sniffing
  add_header X-Content-Type-Options "nosniff" always;
  
  # XSS Protection (legacy pero útil)
  add_header X-XSS-Protection "1; mode=block" always;
  
  # Referrer Policy
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  
  # Permissions Policy (antes Feature-Policy)
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets caching (optional)
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public, immutable";
  }
}


